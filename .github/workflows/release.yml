name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 校验标签与 version.py 一致
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $v = python -c "import version; print(version.__version__)"
          if ($tag -ne $v) {
            Write-Error "标签 ${{ github.ref_name }} 与 version.py 的版本 $v 不一致；请修改 version.py 后重新打标签"
            exit 1
          }
          Write-Output "版本一致：$v"
      - name: 发布前跑全量测试
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pip install -r requirements.txt
          python tests/run_tests.py
          python tests/gui_smoke.py
          python tests/cli_smoke.py
      - name: 打包源码 zip（遵循 .gitattributes）
        run: git archive --format=zip --output ai-metadata-cleaner-${{ github.ref_name }}.zip HEAD
      - name: 构建 Windows 单文件 exe（无需安装 Python）
        env:
          PYI_VERSION: ${{ github.ref_name }}
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm doc_meta_cleaner.spec
      - name: exe 冒烟测试
        run: |
          Copy-Item "dist/AIMetadataCleaner.exe" "$env:TEMP\smoke_app.exe"
          $p = Start-Process "$env:TEMP\smoke_app.exe" -PassThru
          Start-Sleep -Seconds 15
          $wins = Get-Process | Where-Object { $_.MainWindowTitle -like '*文档AI属性清理工具*' }
          if (-not $wins) { Write-Error "exe 启动后主窗口未出现"; exit 1 }
          Write-Output "窗口正常：$($wins[0].MainWindowTitle)"
          $wins | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: 计算 exe 的 SHA256
        id: sha
        run: |
          $hash = (Get-FileHash dist/AIMetadataCleaner.exe -Algorithm SHA256).Hash
          "hash=$hash" >> $env:GITHUB_OUTPUT
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ai-metadata-cleaner-*.zip
            dist/AIMetadataCleaner.exe
          # 「更新内容」默认一句话兜底；发版后可在 Release 页点编辑替换成变更要点
          body: |
            ## 下载

            | 文件 | 说明 |
            | --- | --- |
            | `AIMetadataCleaner.exe` | 单文件程序，双击即用，**无需安装 Python**，离线可用 |
            | `ai-metadata-cleaner-*.zip` | 源码包，解压后按 README「快速开始」运行 |

            **SHA256**：`${{ steps.sha.outputs.hash }}`（AIMetadataCleaner.exe，可用 `Get-FileHash` 核对）

            > 浏览器或 Windows SmartScreen 可能提示「未知发布者 / 已保护你的电脑」：exe 尚未做数字签名，点「更多信息 → 仍要运行」即可。个别杀毒软件可能误报（PyInstaller 打包的常见现象），加入信任列表即可。

            ## 更新内容

            <!-- 发版后可在 Release 页编辑，替换成本版的变更要点 -->
            见下方自动生成的变更记录。
          generate_release_notes: true
